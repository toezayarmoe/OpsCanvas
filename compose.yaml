services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cliflow-app:local
    restart: unless-stopped
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:4000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cliflow}
      DB_USER: ${DB_USER:-cliflow}
      DB_PASSWORD: ${DB_PASSWORD:-local-cliflow-password}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ENABLE_TERMINAL: ${ENABLE_TERMINAL:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:4000"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cliflow}
      MYSQL_USER: ${DB_USER:-cliflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-cliflow-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    volumes:
      - cliflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  cliflow_mysql:
